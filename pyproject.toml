[build-system]
requires = ["setuptools>=84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "convertit"
dynamic = ["version"]
description = "A file conversion Web API in Django"
readme = "README.md"
license = {text = "AGPLV3"}
authors = [
    {name = "Makina Corpus", email = "python@makina-corpus.org"},
]
keywords = ["web", "django", "webservice", "convert"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "Django>=5.2,<5.3",
    "python-magic",
    "Pillow",
    "gunicorn",
    "CairoSVG",
]

[dependency-groups]
dev = [
    "coverage",
    "freezegun",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/makinacorpus/convertit"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
version = {file = "convertit/VERSION"}

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
