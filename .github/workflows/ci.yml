# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI workflow

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
  release:
    types:
      - created

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8

jobs:
  flake8:
    runs-on: ubuntu-latest
    continue-on-error: true
    name: Check flake8 rules
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install flake8
        run: pip install flake8
      - run: flake8 convertit

  isort:
    runs-on: ubuntu-latest
    continue-on-error: true
    name: Check isort rules
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install isort
        run: pip install isort
      - run: isort -c convertit

  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        version: [debian, docker]

    name: Build ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare debian versioning
        if: ${{ matrix.version != 'docker' }}
        run: |
          RAW_VER="$(cat convertit/VERSION | tr -d '[:space:]')"
          BASE_VER="$(echo "$RAW_VER" | sed -E 's/[-+]dev.*//; s/^v//')"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            PKG_VER="${BASE_VER}"
          else
            PKG_VER="${BASE_VER}~dev${GITHUB_RUN_ID}"
          fi
          echo "$PKG_VER" > convertit/VERSION
          sed -i "1s/convertit (\([^)]*\)) [^;]*;/convertit (${PKG_VER}) stable;/" debian/changelog

      - name: Building package
        if: ${{ matrix.version != 'docker' }}
        run: |
          VERSION="$(cat convertit/VERSION)" make build_deb
          cp ./dpkg/*.deb /home/runner/work/convertit/ 2>/dev/null || true
          cp ./dpkg/*.deb ./ 2>/dev/null || true

      - name: Archive package artifact
        if: ${{ matrix.version != 'docker' }}
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: |
            ./dpkg/*.deb

      - name: Set up Docker Buildx
        if: ${{ matrix.version == 'docker' }}
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        if: ${{ matrix.version == 'docker' }}
        run: |
          docker build -t convertit:latest .

      - name: Upload image
        if: ${{ matrix.version == 'docker' }}
        uses: ishworkh/container-image-artifact-upload@v2.0.0
        with:
          image: "convertit:latest"

  e2e:
    strategy:
      matrix:
        distro: [ resolute, noble, jammy, docker ]
        include:
          - distro: resolute
            version: '26.04'

          - distro: noble
            version: '24.04'

          - distro: jammy
            version: '22.04'

          - distro: docker
            version: latest

    name: Test ${{ matrix.distro }}
    runs-on: ubuntu-${{ matrix.version }}
    needs: [ build ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: ${{ matrix.distro != 'docker' }}
        with:
          name: debian-package
          path: /home/runner/work/convertit/convertit/

      - name: Download image
        if: ${{ matrix.distro == 'docker' }}
        uses: ishworkh/container-image-artifact-download@v2.1.0
        with:
          image: "convertit:latest"

      - name: Prepare test server
        run: docker run -d -p 8080:80 -v ./test:/var/www/ -v ./test/nginx.conf:/etc/nginx/conf.d/default.conf nginx:alpine

      - name: Install package
        if: ${{ matrix.distro != 'docker' }}
        run: |
          sudo apt -qq update
          sudo apt-get -yqq install --no-install-recommends /home/runner/work/convertit/convertit/*.deb

      - name: Run docker image (if required)
        if: ${{ matrix.distro == 'docker' }}
        run: |
          docker run -p 6543:6543 -d convertit:latest

      - name: Wait for convertit service
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:6543/ >/dev/null 2>&1 || wget -q -O- http://localhost:6543/ >/dev/null 2>&1; then
              echo "convertit service is ready!"
              exit 0
            fi
            sleep 1
          done
          echo "convertit service failed to start within 30s"
          if command -v systemctl >/dev/null 2>&1; then
            sudo journalctl -u convertit.service --no-pager 2>/dev/null || true
          fi
          exit 1

      - name: Test ODT / PDF conversion
        run: |
          wget -O myfile.pdf "http://localhost:6543/?url=http://172.17.0.1:8080/example.odt&from=application/vnd.oasis.opendocument.text"
          
          if file -b --mime-type ./myfile.pdf |grep -q 'application/pdf'; then
            echo "File is PDF";
            exit 0;
          else
            echo "File is not PDF";
            file -b -f ./myfile.pdf;
            exit 1;
          fi

      - name: Test ODT / DOC conversion
        run: |
          wget -O myfile.doc "http://localhost:6543/?url=http://172.17.0.1:8080/example.odt&from=application/vnd.oasis.opendocument.text&to=application/msword"
          
          if file -b --mime-type ./myfile.doc |grep -q 'application/msword'; then
            echo "File is DOC";
            exit 0;
          else
            echo "File is not DOC";
            file -b -f ./myfile.doc;
            exit 1;
          fi

      - name: Test SVG / PNG conversion
        run: |
          wget -O myfile.png "http://localhost:6543/?url=http://172.17.0.1:8080/example.svg&from=image/svg%2Bxml&to=image/png"
      
          if file -b --mime-type ./myfile.png |grep -q 'image/png'; then
            echo "File is PNG";
            exit 0;
          else
            echo "File is not PNG";
            file -b -f ./myfile.png;
            exit 1;
          fi

      - name: Test SVG / PDF conversion
        run: |
          wget -O myfile.pdf "http://localhost:6543/?url=http://172.17.0.1:8080/example.svg&from=image/svg%2Bxml&to=application/pdf"

          if file -b --mime-type ./myfile.pdf |grep -q 'application/pdf'; then
            echo "File is PDF";
            exit 0;
          else
            echo "File is not PDF";
            file -b -f ./myfile.pdf;
            exit 1;
          fi

  deploy:
    name: Publish (on release only)
    runs-on: ubuntu-latest
    needs: [ flake8, isort, e2e ]
    if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download debian artifact
        uses: actions/download-artifact@v8
        with:
          name: debian-package
          path: /home/runner/work/convertit/convertit/

      - name: Download docker image
        uses: ishworkh/container-image-artifact-download@v2.1.0
        with:
          image: "convertit:latest"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images:  |
            makinacorpus/convertit
            ghcr.io/makinacorpus/convertit

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          push: true
          provenance: mode=max
          sbom: true
          builder: ${{ steps.buildx.outputs.name }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Publish debian packages
        run: |
          if [[ "${{ github.ref }}" == *"dev"* ]]; then
            export DEB_COMPONENT=dev
          else
            export DEB_COMPONENT=main
          fi
          echo "${{ github.ref }} : Publishing as $DEB_COMPONENT package"
          scp -P ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no /home/runner/work/convertit/convertit/convertit_*_amd64.deb ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/packages/incoming/$DEB_COMPONENT/
          if [[ "${{ github.ref }}" == *"dev"* ]]; then
            ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} make debian_dev -C /srv/packages

          else
            ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} make debian_main -C /srv/packages
          fi

      - name: Upload assets to release
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        run: gh release upload "${{ github.ref_name }}" *.deb --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
